<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="#D4A373" opacity="0.65">
  <!-- Outer Circles -->
  <circle cx="120" cy="120" r="114" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="120" cy="120" r="108" stroke-width="2"/>
  <circle cx="120" cy="120" r="82" stroke-width="1"/>

  <!-- Circular Text Path -->
  <path id="circlePath" d="M 120,120 m -94,0 a 94,94 0 1,1 188,0 a 94,94 0 1,1 -188,0" fill="none" stroke="none" />
  
  <text font-family="'Playfair Display', Georgia, serif" font-size="11.5" font-weight="600" fill="#B38A56" letter-spacing="3.5">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      TERRE D'ÉMOTIONS • MAROC •
    </textPath>
  </text>

  <!-- Inner Illustration: Moroccan Palm & Dunes -->
  <!-- Sun -->
  <circle cx="120" cy="98" r="14" fill="#E8CBA3" stroke="none" opacity="0.4"/>
  
  <!-- Dunes -->
  <path d="M78 150 C 95 138, 120 148, 162 145" stroke="#C29D70" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M85 158 C 110 145, 140 155, 155 154" stroke="#C29D70" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Palm Trunk -->
  <path d="M120 150 C121 135, 118 120, 119 108" stroke="#8C6339" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Palm Fronds -->
  <path d="M119 108 C112 100, 102 102, 94 106" stroke="#8C6339" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M119 108 C114 96, 106 92, 98 94" stroke="#8C6339" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M119 108 C118 94, 120 86, 120 84" stroke="#8C6339" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M119 108 C124 96, 132 92, 140 94" stroke="#8C6339" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M119 108 C126 100, 136 102, 144 106" stroke="#8C6339" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Little Stars -->
  <polygon points="120,70 121.5,74 125.5,74.5 122.5,77 123.5,81 120,78.5 116.5,81 117.5,77 114.5,74.5 118.5,74" fill="#D4A373"/>
</svg>
